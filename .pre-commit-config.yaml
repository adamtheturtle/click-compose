---
fail_fast: true

.uv_version: &uv_version uv==0.11.7

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: meta
    hooks:
      - id: check-useless-excludes
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        stages: [pre-commit]

      - id: check-case-conflict
        stages: [pre-commit]

      - id: check-executables-have-shebangs
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]

      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]

      - id: check-symlinks
        stages: [pre-commit]

      - id: check-json
        stages: [pre-commit]

      - id: check-toml
        stages: [pre-commit]

      - id: check-vcs-permalinks
        stages: [pre-commit]

      - id: check-yaml
        stages: [pre-commit]

      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: file-contents-sorter
        files: spelling_private_dict\.txt$
        stages: [pre-commit]

      - id: trailing-whitespace
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-directive-colons
        stages: [pre-commit]

      - id: rst-inline-touching-normal
        stages: [pre-commit]

      - id: text-unicode-replacement-char
        stages: [pre-commit]

      - id: rst-backticks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: uv run --extra=dev actionlint
        language: python
        pass_filenames: false
        types_or: [yaml]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: check-manifest
        name: check-manifest
        entry: uv run --extra=dev check-manifest
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: deptry
        name: deptry
        entry: uv run --extra=dev deptry src
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      # Vale enforces prose style rules, such as banning em dashes, in
      # reStructuredText and Markdown files.
      # The rules come from the ``ClearProse`` package pinned in ``.vale.ini``,
      # which ``vale sync`` downloads into the (gitignored) ``styles``
      # directory.
      # Vale needs ``rst2html`` from Docutils on the ``PATH`` to parse
      # reStructuredText.
      # ``vale sync`` also runs when ``.vale.ini`` changes, so a package
      # bump takes effect without waiting for the next reStructuredText
      # change.
      - id: vale-sync
        name: vale sync
        entry: uv run --extra=dev vale sync
        language: python
        pass_filenames: false
        files: (\.(rst|md)$|^\.vale\.ini$)
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: vale
        name: vale
        entry: uv run --extra=dev vale
        language: python
        types_or: [rst, markdown]
        require_serial: true
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: doc8
        name: doc8
        entry: uv run --extra=dev doc8
        language: python
        files: \.(rst|txt)$
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: pydocstringformatter
        name: pydocstringformatter
        entry: uv run --extra=dev pydocstringformatter
        language: python
        types_or: [python, pyi]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: docs
        name: docs
        entry: uv run --extra=dev sphinx-build -W docs/source/ docs/build/
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: interrogate
        name: interrogate
        entry: uv run --extra=dev interrogate
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: interrogate-docs
        name: interrogate docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python
          --command="interrogate"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: linkcheck
        name: linkcheck
        entry: uv run --extra=dev sphinx-build -W -b linkcheck docs/source/ docs/build/
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [manual]

      - id: mypy
        name: mypy
        entry: uv run --extra=dev mypy --num-workers=4
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
        stages: [pre-push]
        require_serial: true

      # We do not use --example-workers 0 due to https://github.com/python/mypy/issues/18283
      - id: mypy-docs
        name: mypy-docs
        entry: uv run --extra=dev doccmd --no-write-to-file --language=python --command="mypy
          --num-workers=4"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: pylint
        name: pylint
        entry: uv run --extra=dev pylint
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
        stages: [pre-push]
        require_serial: true

      - id: pylint-docs
        name: pylint-docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python
          --command="pylint"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [manual]

      - id: pyproject-fmt-fix
        name: pyproject-fmt
        entry: uv run --extra=dev pyproject-fmt
        language: python
        files: pyproject.toml
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: pyright
        name: pyright
        entry: uv run --extra=dev pyright
        language: python
        types_or: [python]
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]
        require_serial: true

      - id: pyright-docs
        name: pyright-docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python
          --command="pyright"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: pyright-verifytypes
        name: pyright --verifytypes
        entry: uv run --extra=dev pyright --verifytypes click_compose
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: ty
        name: ty
        entry: uv run --extra=dev ty check
        language: python
        types_or: [python, toml]
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: ty-docs
        name: ty-docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python
          --command="ty check"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: pyrefly
        name: pyrefly
        entry: uv run --extra=dev pyrefly check
        language: python
        types_or: [python, toml]
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: pyrefly-docs
        name: pyrefly-docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python
          --command="pyrefly check"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: pyroma
        name: pyroma
        entry: uv run --extra=dev pyroma --min 10 .
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: ruff-check-fix
        name: ruff check
        entry: uv run --extra=dev ruff check --fix --force-exclude
        language: python
        types_or: [python, pyi]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]
        require_serial: true

      - id: ruff-check-fix-docs
        name: ruff check fix docs
        entry: uv run --extra=dev doccmd --language=python --command="ruff check --fix"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: ruff-format-fix
        name: ruff format
        entry: uv run --extra=dev ruff format --force-exclude
        language: python
        types_or: [python, pyi]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]
        require_serial: true

      - id: ruff-format-fix-docs
        name: ruff format docs
        entry: uv run --extra=dev doccmd --language=python --no-pad-file --command="ruff
          format"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: strict-kwargs-fix
        name: strict-kwargs
        entry: uv run --extra=dev strict-kwargs check --diff
        language: python
        types_or: [python, pyi]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]
        require_serial: true

      - id: no-defaults
        name: no-defaults
        entry: uv run --extra=dev no-defaults
        language: python
        types_or: [python]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]
        require_serial: true

      - id: shellcheck
        name: shellcheck
        entry: uv run --extra=dev shellcheck
        language: python
        types: [shell]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: shellcheck-docs
        name: shellcheck-docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=shell
          --language=console --command="shellcheck --shell=bash"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: shfmt
        name: shfmt
        entry: uv run --extra=dev shfmt -w -s -i 4
        language: python
        types: [shell]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: shfmt-docs
        name: shfmt-docs
        entry: uv run --extra=dev doccmd --language=shell --language=console --skip-marker=shfmt
          --no-pad-file --command="shfmt --write --space-redirects --indent=4"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: spelling
        name: spelling
        entry: uv run --extra=dev sphinx-build -W -b spelling docs/source/ docs/build/
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: sphinx-lint
        name: sphinx-lint
        entry: uv run --extra=dev sphinx-lint --enable all --max-line-length 200
        language: python
        types: [rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: vulture
        name: vulture
        entry: uv run --extra=dev vulture .
        language: python
        pass_filenames: false
        additional_dependencies: [*uv_version]
        stages: [pre-push]

      - id: vulture-docs
        name: vulture docs
        entry: uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python
          --command="vulture"
        language: python
        types_or: [markdown, rst]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: yamlfix
        name: yamlfix
        entry: uv run --extra=dev yamlfix
        language: python
        types: [yaml]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]

      - id: zizmor
        name: zizmor
        entry: uv run --extra=dev zizmor --strict-collection .github
        language: python
        pass_filenames: false
        types_or: [yaml]
        additional_dependencies: [*uv_version]
        stages: [pre-commit]
